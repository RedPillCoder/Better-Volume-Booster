<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>cross-origin iframe top</title></head>
<body>
<h1>Top frame on another origin</h1>
<iframe id="f" src="http://127.0.0.1:8000/iframe-child.html" width="320" height="120"></iframe>
<p id="state">waiting</p>
<script>
	addEventListener("message", e => {
		if (e.data === "played" || e.data === "error") {
			document.getElementById("state").textContent = e.data;
		}
	});
</script>
</body>
</html>
