<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>same-origin media</title></head>
<body>
<h1>Same-origin media test</h1>
<audio id="m" src="tone.wav" autoplay muted></audio>
<p id="state">waiting</p>
<script>
	const m = document.getElementById("m");
	m.addEventListener("play", () => document.getElementById("state").textContent = "playing");
	m.addEventListener("error", () => document.getElementById("state").textContent = "error");
</script>
</body>
</html>
